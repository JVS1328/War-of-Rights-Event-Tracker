<title>Season Tracker — full UI overhaul</title>
<style>
/*FONTS*/

:root{
  --ground:#e8e6e1; --surface:#f6f5f2; --raised:#ecebe6; --sunken:#dedbd4;
  --line:#c9c5bc; --line-2:#a8a397; --line-3:#6f6a5f;
  --ink:#1a1916; --ink-2:#55514a; --ink-3:#867f73;
  --union:#2f6249; --union-fill:#1a6493; --union-wash:#2f624914;
  --reb:#8c5c1e; --reb-fill:#b06a0a; --reb-wash:#8c5c1e14;
  --st1:#3c5b6e; --st2:#7d6a3c; --st3:#9c4b25;
  --live:#7a3b1c;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0a0b0a; --surface:#111312; --raised:#171a18; --sunken:#0d0f0e;
    --line:#242826; --line-2:#39403c; --line-3:#5c655f;
    --ink:#e7e5df; --ink-2:#9a978e; --ink-3:#67645c;
    --union:#6faa87; --union-fill:#1b4a6e; --union-wash:#6faa871a;
    --reb:#d3a163; --reb-fill:#7a5510; --reb-wash:#d3a1631a;
    --st1:#6f93a8; --st2:#a08a56; --st3:#c4744a; --live:#d3814a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0a0b0a; --surface:#111312; --raised:#171a18; --sunken:#0d0f0e;
  --line:#242826; --line-2:#39403c; --line-3:#5c655f;
  --ink:#e7e5df; --ink-2:#9a978e; --ink-3:#67645c;
  --union:#6faa87; --union-fill:#1b4a6e; --union-wash:#6faa871a;
  --reb:#d3a163; --reb-fill:#7a5510; --reb-wash:#d3a1631a;
  --st1:#6f93a8; --st2:#a08a56; --st3:#c4744a; --live:#d3814a;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --ground:#e8e6e1; --surface:#f6f5f2; --raised:#ecebe6; --sunken:#dedbd4;
  --line:#c9c5bc; --line-2:#a8a397; --line-3:#6f6a5f;
  --ink:#1a1916; --ink-2:#55514a; --ink-3:#867f73;
  --union:#2f6249; --union-fill:#1a6493; --union-wash:#2f624914;
  --reb:#8c5c1e; --reb-fill:#b06a0a; --reb-wash:#8c5c1e14;
  --st1:#3c5b6e; --st2:#7d6a3c; --st3:#9c4b25; --live:#7a3b1c;
  color-scheme:light;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:'ST Mono',ui-monospace,'SF Mono',Menlo,monospace;
  font-size:12.5px; line-height:1.45; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
/* Prose and human names are the ONLY sans on the page — everything the
   instrument says about itself stays monospace. */
.sans{font-family:'ST Sans',ui-sans-serif,system-ui,sans-serif; font-variant-numeric:normal}
h1,h2,h3{margin:0; font-size:inherit; font-weight:600; letter-spacing:.02em}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; text-align:left}
:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
::selection{background:var(--ink); color:var(--ground)}

/* ══ ledger primitives ═════════════════════════════════════════════ */
.cap{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.rule{flex:1 1 auto; height:0; border-top:1px solid var(--line); min-width:12px; align-self:center}
.panel{background:var(--surface); border:1px solid var(--line); margin-bottom:18px}
.ph{display:flex; align-items:center; gap:11px; padding:9px 13px; border-bottom:1px solid var(--line); background:var(--raised); flex-wrap:wrap}
.ph h2{font-size:11px; letter-spacing:.14em; text-transform:uppercase}
.ph .meta{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.pb{padding:13px; max-width:100%}
.pb:not(.flush){overflow-x:auto}
.pb.flush{padding:0}
.scroll-x{overflow-x:auto}

.big{font-size:46px; font-weight:600; letter-spacing:-.05em; line-height:.88}
.mid{font-size:23px; font-weight:600; letter-spacing:-.03em; line-height:1}

/* ══ frame ═════════════════════════════════════════════════════════ */
.app{display:grid; grid-template-columns:198px minmax(0,1fr); min-height:100vh}
.rail{
  border-right:1px solid var(--line); background:var(--surface);
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.rail-h{padding:14px 13px 12px; border-bottom:1px solid var(--line)}
.rail-h .t{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase}
.rail-h .s{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-top:3px}
.rgrp{padding:11px 0 4px}
.rgrp > .cap{padding:0 13px 5px; display:block}
.rail button{
  display:flex; align-items:center; gap:8px; width:100%; padding:5px 13px;
  font-size:12px; color:var(--ink-2); border-left:3px solid transparent;
}
.rail button:hover{background:var(--raised); color:var(--ink)}
.rail button[aria-current="true"]{background:var(--ink); color:var(--ground); border-left-color:var(--live); font-weight:500}
.rail button .n{margin-left:auto; font-size:10px; color:var(--ink-3)}
.rail button[aria-current="true"] .n{color:var(--ground); opacity:.6}

.main{min-width:0; padding:0 0 60px}
.crumb{
  display:flex; align-items:center; gap:10px; padding:11px 20px;
  border-bottom:1px solid var(--line); background:var(--surface); flex-wrap:wrap;
  position:sticky; top:0; z-index:9;
}
.crumb select{font:inherit; font-size:11.5px; padding:3px 6px; border:1px solid var(--line-2);
  background:var(--surface); color:var(--ink); border-radius:0; max-width:190px}
.crumb .sc{display:flex; border:1px solid var(--line); margin-left:auto}
.crumb .sc button{padding:3px 10px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.crumb .sc button[aria-pressed="true"]{background:var(--ink); color:var(--ground)}
.body{padding:20px; max-width:1120px}

/* ══ faction ═══════════════════════════════════════════════════════ */
.tag{
  display:inline-flex; align-items:center; padding:1px 6px; font-size:10px;
  letter-spacing:.12em; text-transform:uppercase; font-weight:600;
  background:var(--ink); color:var(--ground);
}
.tag.usa{background:var(--union-fill); color:#fff}
.tag.csa{background:var(--reb-fill); color:#fff}
.tag.q{background:none; border:1px solid var(--line-2); color:var(--ink-2); font-weight:400; letter-spacing:.06em; text-transform:none; font-size:11px}
.f-usa{color:var(--union)} .f-csa{color:var(--reb)}
.stripe-usa{border-left:3px solid var(--union)}
.stripe-csa{border-left:3px solid var(--reb)}

/* ══ tables ════════════════════════════════════════════════════════ */
table{width:100%; border-collapse:collapse; font-size:12px}
thead th{
  padding:6px 9px; text-align:left; white-space:nowrap;
  font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; color:var(--ink-3);
  border-bottom:2px solid var(--line-2); background:var(--raised);
}
thead th.num{text-align:right}
thead th.s{cursor:pointer; user-select:none}
thead th.s:hover, thead th[aria-sort]{color:var(--ink)}
tbody td{padding:5px 9px; border-bottom:1px solid var(--line)}
tbody td.num{text-align:right}
tbody tr.click:hover{background:var(--raised); cursor:pointer}
tbody tr.click:hover td:first-child{box-shadow:inset 3px 0 0 var(--live)}
tfoot td{padding:6px 9px; border-top:2px solid var(--line-2); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.pos{display:inline-block; min-width:19px; color:var(--ink-3)}
.pos.q{color:var(--ink); font-weight:600}
.nm{font-family:'ST Sans',ui-sans-serif,system-ui,sans-serif; font-variant-numeric:normal}

/* ══ diverging spine ═══════════════════════════════════════════════ */
.spine{border-top:1px solid var(--line)}
.sr{display:grid; grid-template-columns:58px 1fr 186px 1fr 58px; align-items:center; gap:9px; padding:6px 13px; border-bottom:1px solid var(--line); position:relative}
.sr::before{content:''; position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--line); transform:translateX(-.5px)}
.sr:hover{background:var(--raised)}
.sv{font-size:13.5px; font-weight:600}
.sv.l{text-align:right} .sv.r{text-align:left}
.sv.off{color:var(--ink-3); font-weight:400}
.sl{text-align:center; z-index:1; background:inherit}
.sl .h{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
.sl .u{font-size:9.5px; letter-spacing:.06em; color:var(--ink-3)}
.trk{height:8px; background:var(--sunken); display:flex}
.trk.l{justify-content:flex-end}
.trk i{display:block; height:100%}
.sr.txt .trk{background:none}
.sr.txt .tv{font-size:11px; color:var(--ink-2)}
.sr.txt .tv.l{text-align:right} .sr.txt .tv.r{text-align:left}

/* ══ scoreline ═════════════════════════════════════════════════════ */
.score{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center; padding:20px 16px}
.sd{display:flex; flex-direction:column; align-items:flex-start; gap:5px; min-width:0}
.sd.r{align-items:flex-end; text-align:right}
.sd .who{font-size:15px; font-weight:600; letter-spacing:-.01em}
.sd .sub{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.sd.lose .big,.sd.lose .who{color:var(--ink-3)}
.mid-col{display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--ink-3)}
.mid-col .v{width:1px; height:20px; background:var(--line-2)}
.stripebar{display:flex; height:3px}
.stripebar i{display:block; height:100%}

/* ══ misc ══════════════════════════════════════════════════════════ */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.kpi{padding:11px 13px; border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.kpi:last-child{border-right:none}
.kpi .v{font-size:26px; font-weight:600; letter-spacing:-.035em; line-height:1.05; margin-top:2px}
.kpi .h{font-size:10px; color:var(--ink-3); margin-top:2px}
.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(272px,1fr))}
.col{padding:13px; border-right:1px solid var(--line)}
.col:last-child{border-right:none}
.click-col{cursor:pointer}
.click-col:hover{background:var(--raised)}
.click-col:hover .note:last-child{text-decoration:underline}
.hb{display:grid; grid-template-columns:74px 1fr 38px; align-items:center; gap:8px; font-size:11.5px; margin-top:5px}
.hb .t{height:7px; background:var(--sunken)}
.hb .t i{display:block; height:100%; background:var(--line-3)}
.hb .n{text-align:right; color:var(--ink-2)}
.stack{display:flex; height:9px; background:var(--sunken)}
.stack i{display:block; height:100%}
.leg{display:flex; gap:13px; flex-wrap:wrap; font-size:10.5px; color:var(--ink-2); margin-top:6px}
.leg span{display:inline-flex; align-items:center; gap:5px}
.leg i{width:8px; height:8px; display:inline-block}
.form{display:flex; gap:3px; align-items:flex-end; height:38px}
.form i{flex:0 1 22px; background:var(--ink); opacity:.22; min-width:5px}
.form i.w{opacity:1}
.pctbar{height:2px; background:var(--sunken); margin-top:5px}
.pctbar i{display:block; height:100%; background:var(--ink)}
.ctl{display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:9px 13px; border-bottom:1px solid var(--line); background:var(--raised)}
input[type=search],select{font:inherit; font-size:11.5px; padding:4px 7px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); border-radius:0; min-width:0}
input[type=search]{width:190px}
.seg{display:flex; border:1px solid var(--line-2)}
.seg button{padding:3px 9px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--ground)}
.gh{padding:4px 9px; border:1px solid var(--line-2); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
.gh:hover{color:var(--ink); border-color:var(--ink-3)}
.gh[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}
.gloss{display:none}
.gloss.on{display:grid; grid-template-columns:repeat(auto-fit,minmax(218px,1fr)); gap:11px 20px; padding:13px; border-bottom:1px solid var(--line); background:var(--sunken)}
/* ── forms ─────────────────────────────────────────────────────── */
.grid-f{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:11px}
.fld{display:flex; flex-direction:column; gap:4px; min-width:0}
.fld input,.fld select{font:inherit; font-size:12px; padding:5px 7px; border:1px solid var(--line-2);
  background:var(--surface); color:var(--ink); border-radius:0; width:100%; min-width:0}
.fld input:focus,.fld select:focus{border-color:var(--ink); outline:none}
.fld .note{font-size:10px; line-height:1.45}
textarea{font:inherit; font-size:11.5px; padding:7px; border:1px solid var(--line-2);
  background:var(--surface); color:var(--ink); border-radius:0; resize:vertical; width:100%}
.chk{display:flex; align-items:flex-start; gap:8px; cursor:pointer; font-size:12px}
.chk input{margin-top:2px; accent-color:var(--ink)}
.chk .l{display:block}
.chk .note{display:block; margin-top:1px}
.gloss dt{font-size:11px; font-weight:600; margin-bottom:2px}
.gloss dd{margin:0; font-size:10.5px; color:var(--ink-2); line-height:1.5}
.prose{font-size:12.5px; line-height:1.6; color:var(--ink-2); max-width:62ch}
.prose b{color:var(--ink); font-weight:600}
.prose p + p{margin-top:9px}
.note{font-size:11px; color:var(--ink-3); line-height:1.55}
.bracket{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.bslot{padding:12px 13px; border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.bpair{border:1px solid var(--line); margin-top:8px}
.bteam{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 9px; font-size:12px}
.bteam + .bteam{border-top:1px solid var(--line)}
.bteam.win{background:var(--raised); font-weight:600}
.bteam.win .s{color:var(--ink)}
.bteam .s{color:var(--ink-3); font-size:11px}
.view{display:none} .view.on{display:block}
.rl{display:flex; flex-wrap:wrap; gap:4px}
.rl .tag.q{cursor:default}


.hm-c{width:30px; height:23px; padding:0; border:none; text-align:center; font-size:10px;
  cursor:default; font-variant-numeric:tabular-nums}
.hm-c:hover,.hm-c:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}
.hm-x{background:var(--sunken)}
.hm-ramp{display:flex; height:10px}
.hm-ramp i{display:block; width:14px; height:100%}
.mapgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:11px}
.mapcard{border:1px solid var(--line); background:var(--raised); padding:11px}
.mapdl{margin:9px 0 0; display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:11px}
.mapdl dt{color:var(--ink-3); white-space:nowrap}
.mapdl dd{margin:0; color:var(--ink-2); line-height:1.5}
.area-h{cursor:pointer; user-select:none}
.area-h:hover{background:var(--sunken)}

.sec{display:flex; flex-direction:column; gap:9px}
.sec-h{display:flex; align-items:center; gap:10px}
.find{display:flex; align-items:center; border:1px solid var(--line-2); background:var(--surface); padding:0 6px}
.find input{border:none; background:none; color:var(--ink); font:inherit; font-size:11px; padding:3px 0; width:150px; outline:none}
.pager{display:flex; align-items:center; justify-content:space-between; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); border-top:1px solid var(--line); padding-top:7px}
.pager .pg{display:flex; align-items:center; gap:5px}
.pager button{border:1px solid var(--line-2); padding:1px 7px; color:var(--ink-2); line-height:1.4}
.pager button:hover:not(:disabled){color:var(--ink); border-color:var(--ink-3)}
.pager button:disabled{opacity:.35; cursor:not-allowed}
tr.exp > td{background:var(--sunken); padding:13px}
.bd .cap{letter-spacing:.1em}
.tg.zero{opacity:.4; cursor:not-allowed; border-style:dashed}
.stitle{display:flex; align-items:baseline; gap:9px; margin:22px 0 11px}

.ostat{display:grid; grid-template-columns:repeat(auto-fit,minmax(76px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line)}
.ostat span{display:flex; flex-direction:column; gap:1px; padding:6px 8px; background:var(--surface)}
.ostat b{font-size:15px; font-weight:600; letter-spacing:-.02em}
.ostat i{font-style:normal; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
table.mini-t{font-size:11px}
table.mini-t thead th{padding:4px 7px; font-size:9.5px}
table.mini-t tbody td{padding:4px 7px}
.wp{display:grid; grid-template-columns:1fr 84px auto; align-items:center; gap:8px; margin-top:6px; font-size:11px}
.wp .t{display:flex; height:7px; background:var(--sunken)}
.wp .t i{display:block; height:100%}
.wp .n{font-variant-numeric:tabular-nums; color:var(--ink-2)}
.wp .note{grid-column:1/-1; margin-top:-3px}

/* ── toggle chips (unit pools, balance swaps) ─────────────────────── */
.tgs{display:flex; flex-wrap:wrap; gap:5px}
.tg{display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border:1px solid var(--line-2);
  background:var(--surface); color:var(--ink-3); font-size:11.5px; line-height:1.3;
  font-family:'ST Sans',ui-sans-serif,system-ui,sans-serif}
.tg:hover{border-color:var(--ink-3); color:var(--ink-2)}
.tg.on{background:var(--ink); color:var(--ground); border-color:var(--ink)}
.tg .n{font-family:'ST Mono',ui-monospace,monospace; font-size:10px; opacity:.65}
.pair-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:7px}
.pair-row select{flex:0 1 170px; font:inherit; font-size:12px; padding:4px 7px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink); border-radius:0}

/* ══ charts ═══════════════════════════════════════════════════════ */
.spark{display:block; overflow:visible}
.sgn{position:relative; display:inline-block; height:9px; vertical-align:middle; background:var(--sunken)}
.sgn .ax{position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:var(--line-2)}
.sgn .bar{position:absolute; top:0; bottom:0; background:var(--ink)}
/* Heatmap: one hue, light to dark. A 2px surface gap keeps cells legible. */
table.hm{border-collapse:separate; border-spacing:2px; width:auto; margin:0}
.hm-corner{background:none; border:none}
.hm-col{background:none; border:none; padding:0 0 6px; vertical-align:bottom; text-align:center;
  font-size:9.5px; letter-spacing:.04em; text-transform:none; color:var(--ink-2); white-space:nowrap}
.hm-col span{display:inline-block; writing-mode:vertical-rl; transform:rotate(180deg)}
.hm-row{background:none; border:none; padding:0 8px 0 0; text-align:right; white-space:nowrap;
  font-size:10.5px; letter-spacing:.02em; text-transform:none; color:var(--ink-2); font-weight:400;
  font-family:'ST Sans',ui-sans-serif,system-ui,sans-serif}
.hm-legend{display:flex; align-items:center; gap:4px; margin-bottom:11px}
.hm-legend .cap{margin:0 4px}
#tip{position:fixed; z-index:60; pointer-events:none; display:none; max-width:250px;
  padding:5px 8px; background:var(--ink); color:var(--ground); font-size:11px; line-height:1.4}

@media (max-width:840px){
  .app{grid-template-columns:1fr}
  .rail{position:static; max-height:none; border-right:none; border-bottom:1px solid var(--line); display:flex; overflow-x:auto}
  .rail-h{display:none}
  .rgrp{display:flex; padding:0; align-items:center}
  .rgrp > .cap{display:none}
  .rail button{width:auto; white-space:nowrap; border-left:none; border-bottom:3px solid transparent; padding:8px 11px}
  .rail button[aria-current="true"]{border-left-color:transparent; border-bottom-color:var(--live)}
  .rail button .n{display:none}
  .ph .meta{white-space:normal; text-align:left}
  .ph h2{flex:0 0 auto}
  .ph .rule{display:none}
  .sr{grid-template-columns:44px 1fr 104px 1fr 44px; gap:5px; padding:6px 9px}
  .sl .u{display:none}
  .big{font-size:32px}
  .body{padding:13px}
  input[type=search]{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <div class="main">
    <div class="crumb">
      <span class="cap">Event</span>
      <select id="ev-pick" aria-label="Active event"></select>
      <select id="se-pick" aria-label="Active season"></select>
      <button class="gh" id="ev-new" title="New event — its own registry and Elo ladder">＋ Event</button>
      <span class="rule"></span>
      <span class="cap" id="crumb-t">Season</span>
      <span class="cap" id="crumb-m"></span>
      <div class="sc" id="scope" role="group" aria-label="Stats scope">
        <button data-s="s3" aria-pressed="true">Season 3</button>
        <button data-s="all" aria-pressed="false">All seasons</button>
      </div>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>

<script>
const D = /*DATA*/;
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n1 = v => v==null?'—':v.toFixed(1);
const n2 = v => v==null?'—':v.toFixed(2);
const pc = (a,b)=> b>0 ? Math.round(a/b*100) : 0;
const dur = s => `${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`;
const TW={inForm:1,skirm:3,oob:5};
const tix = c => c.inForm*TW.inForm + c.skirm*TW.skirm + c.oob*TW.oob;
const bare = n => n.replace(/^\[[^\]]+\]/,'');
const ord = n => n+(['th','st','nd','rd'][(n%100-n%10!=10)*(n%10<4)*n%10]||'th');

/* ── ledger panel ────────────────────────────────────────────────── */
const panel = (title, meta, inner, flush) =>
  `<section class="panel"><header class="ph"><h2>${esc(title)}</h2><i class="rule"></i>
   ${meta?`<span class="meta">${esc(meta)}</span>`:''}</header>
   <div class="pb${flush?' flush':''}">${inner}</div></section>`;

/* ── diverging spine, shared by every head-to-head on the page ───── */
function spine(rows, ac, bc){
  const col = c => c==='usa'?'var(--union)':c==='csa'?'var(--reb)':'var(--ink)';
  return `<div class="spine">`+rows.map(r=>{
    if(r.txt) return `<div class="sr txt"><div></div><div class="tv l">${esc(r.a)}</div>
      <div class="sl"><div class="h">${esc(r.label)}</div></div>
      <div class="tv r">${esc(r.b)}</div><div></div></div>`;
    const m = Math.max(Math.abs(r.a),Math.abs(r.b))||1;
    const aWin = r.lower ? r.a<r.b : r.a>r.b, tie = r.a===r.b;
    const aOn = tie||aWin, bOn = tie||!aWin;
    return `<div class="sr">
      <div class="sv l ${aOn?'':'off'}">${esc(r.af??r.a)}</div>
      <div class="trk l"><i style="width:${Math.abs(r.a)/m*100}%;background:${col(ac)};opacity:${aOn?1:.28}"></i></div>
      <div class="sl"><div class="h">${esc(r.label)}</div>${r.sub?`<div class="u">${esc(r.sub)}</div>`:''}</div>
      <div class="trk"><i style="width:${Math.abs(r.b)/m*100}%;background:${col(bc)};opacity:${bOn?1:.28}"></i></div>
      <div class="sv r ${bOn?'':'off'}">${esc(r.bf??r.b)}</div></div>`;
  }).join('')+`</div>`;
}

const scoreline = (A,B,winner,label) => `
  <div class="score">
    <div class="sd ${winner==='A'?'':'lose'}">
      ${A.tag}<span class="who nm">${esc(A.name)}</span>
      <span class="big ${A.cls||''}">${esc(A.val)}</span><span class="sub">${esc(A.sub)}</span>
    </div>
    <div class="mid-col"><span class="v"></span><span class="cap">${esc(label)}</span><span class="v"></span></div>
    <div class="sd r ${winner==='B'?'':'lose'}">
      ${B.tag}<span class="who nm">${esc(B.name)}</span>
      <span class="big ${B.cls||''}">${esc(B.val)}</span><span class="sub">${esc(B.sub)}</span>
    </div>
  </div>`;

const stripebar = (a,b,ac,bc) => `<div class="stripebar">
  <i style="width:${pc(a,a+b)}%;background:var(--${ac})"></i><i style="flex:1;background:var(--${bc})"></i></div>`;

const hbars = (entries,total,color) => {
  const m = Math.max(...entries.map(e=>e[1]))||1;
  return entries.map(([k,v])=>`<div class="hb"><span>${esc(k)}</span>
    <span class="t"><i style="width:${v/m*100}%${color?`;background:${color}`:''}"></i></span>
    <span class="n">${pc(v,total)}%</span></div>`).join('');
};

const stanceStack = (a,b,c,label) => {
  const t=a+b+c||1;
  return `<div class="cap">${esc(label)}</div>
   <div class="stack" style="margin-top:7px">
     <i style="width:${a/t*100}%;background:var(--st1)"></i>
     <i style="width:${b/t*100}%;background:var(--st2)"></i>
     <i style="width:${c/t*100}%;background:var(--st3)"></i></div>
   <div class="leg">
     <span><i style="background:var(--st1)"></i>In formation · 1 tkt · ${a} · ${pc(a,t)}%</span>
     <span><i style="background:var(--st2)"></i>Skirmish · 3 · ${b} · ${pc(b,t)}%</span>
     <span><i style="background:var(--st3)"></i>Out of line · 5 · ${c} · ${pc(c,t)}%</span></div>`;
};

/* ══ SCREENS ═════════════════════════════════════════════════════ */
const V = {};
let state = {player:D.leaderboard[0].id, unit:D.regiments[0].unit,
             round:D.matchups.length-1, week:D.weeks.length-5,
             cmpA:D.leaderboard[0].id, cmpB:D.leaderboard[2].id, idScope:'overall', roundType:null, schedMode:'paste', roundTab:'matchup', heatMode:'mate', event:'evt_ssl', season:'s3', mapSrc:'tracker', openAreas:null, newEvent:false, leadStyle:'single',
             ui:{}, exp:[], cmpMode:'player', cmpUA:null, cmpUB:null, poolOut:[], pairs:[['CB','JD']], maxDiff:10, swaps:{},
             split:{regular:2,special:1,specialCap:20,cavalry:1,cavalryCap:30},
             pSort:{k:'k',d:-1}, pQ:'', pClass:'all', rSort:{k:'kd',d:-1}};

/* ── Season dashboard ───────────────────────────────────────────── */
V.dash = () => {
  const s = D.season, top = D.standings.slice(0,6);
  const last = D.weeks.filter(w=>w.r1).slice(-1)[0];
  const kpis = [
    ['Units', s.units, `${s.divisions.length} divisions`],
    ['Nights', s.weeks, `${s.regular} regular · ${s.weeks-s.regular} playoff`],
    ['Rounds played', s.roundsPlayed, `${s.roundsImported} with scoreboards`],
    ['Players seen', s.players, 'unique by steam id'],
    ['Kills logged', s.kills.toLocaleString(), 'across imported rounds'],
  ].map(([h,v,x])=>`<div class="kpi"><div class="cap">${h}</div><div class="v">${v}</div><div class="h">${x}</div></div>`).join('');

  const ldr = top.map(r=>`<tr class="click" data-go="unit" data-id="${esc(r.unit)}">
     <td><span class="pos ${r.pos<=4?'q':''}">${r.pos}</span></td>
     <td class="nm">${esc(r.unit)}</td>
     <td><span class="tag q">${esc(r.div)}</span></td>
     <td class="num" style="font-weight:600">${r.points}</td>
     <td class="num">${r.w}–${r.l}</td>
     <td class="num" style="color:var(--ink-3)">${r.wr}%</td></tr>`).join('');

  const wkRows = D.weeks.filter(w=>w.r1).slice(-5).reverse().map(w=>{
    const sweep = w.r1===w.r2;
    return `<tr class="click" data-go="week" data-id="${w.n-1}">
      <td style="color:var(--ink-3)">W${w.n}</td>
      <td class="nm">${esc(w.leadA||'—')} <span style="color:var(--ink-3)">vs</span> ${esc(w.leadB||'—')}</td>
      <td>${w.playoffs?'<span class="tag q">Playoff</span>':''}</td>
      <td class="num">${w.r1==='A'?'1':'0'}–${w.r1==='B'?'1':'0'} / ${w.r2==='A'?'1':'0'}–${w.r2==='B'?'1':'0'}</td>
      <td class="num"><span class="tag ${(sweep?'usa':'q')}" style="${sweep?'':'background:none'}">${sweep?'2–0 '+(w.r1==='A'?'A':'B'):'Split'}</span></td></tr>`;
  }).join('');

  return `
    ${panel('Season at a glance', `${esc(s.event)} · ${esc(s.name)}`, `<div class="kpis">${kpis}</div>`, true)}
    <div class="panel"><header class="ph"><h2>Standings</h2><i class="rule"></i>
      <span class="meta">top six · ${D.standings.length} units</span></header>
      <div class="pb flush scroll-x"><table>
        <thead><tr><th></th><th>Unit</th><th>Division</th><th class="num">Pts</th><th class="num">W–L</th><th class="num">Win %</th></tr></thead>
        <tbody>${ldr}</tbody>
        <tfoot><tr><td colspan="6">${D.season.pointSystem.winLead} lead win · ${D.season.pointSystem.winAssist} assist win · ${D.season.pointSystem.lossAssist} assist loss · ${D.season.pointSystem.bonus2_0Assist} sweep</td></tr></tfoot>
      </table></div></div>
    <div class="panel"><header class="ph"><h2>Recent nights</h2><i class="rule"></i><span class="meta">last five</span></header>
      <div class="pb flush scroll-x"><table>
        <thead><tr><th>Night</th><th>Leads</th><th></th><th class="num">R1 / R2</th><th class="num">Result</th></tr></thead>
        <tbody>${wkRows}</tbody></table></div></div>`;
};

/* ── Standings ──────────────────────────────────────────────────── */
V.standings = () => {
  const byDiv = D.divisions.map(dv=>{
    const rows = D.standings.filter(r=>r.div===dv.name);
    return `<div class="col"><div class="cap" style="margin-bottom:7px">${esc(dv.name)} division</div>
      <table><thead><tr><th></th><th>Unit</th><th class="num">Pts</th><th class="num">W–L</th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr class="click" data-go="unit" data-id="${esc(r.unit)}">
        <td><span class="pos ${i<2?'q':''}">${i+1}</span></td><td class="nm">${esc(r.unit)}</td>
        <td class="num" style="font-weight:600">${r.points}</td><td class="num">${r.w}–${r.l}</td></tr>`).join('')}</tbody></table></div>`;
  }).join('');

  const full = D.standings.map(r=>`<tr class="click" data-go="unit" data-id="${esc(r.unit)}">
    <td><span class="pos ${r.pos<=4?'q':''}">${r.pos}</span></td>
    <td class="nm">${esc(r.unit)}</td><td><span class="tag q">${esc(r.div)}</span></td>
    <td class="num" style="font-weight:600">${r.points}</td>
    <td class="num">${r.leadWins}–${r.leadLosses}</td>
    <td class="num">${r.assistWins}–${r.assistLosses}</td>
    <td class="num">${r.w}–${r.l}</td>
    <td class="num"><span style="display:inline-block;width:46px;height:5px;background:var(--sunken);vertical-align:middle;margin-right:6px"><i style="display:block;height:100%;width:${r.wr}%;background:var(--ink)"></i></span>${r.wr}%</td></tr>`).join('');

  return `
    ${panel('By division', 'top two qualify', `<div class="cols">${byDiv}</div>`, true)}
    <div class="panel"><header class="ph"><h2>Full table</h2><i class="rule"></i>
      <span class="meta">lead and assist records split out</span></header>
      <div class="pb flush scroll-x"><table>
        <thead><tr><th></th><th>Unit</th><th>Div</th><th class="num">Pts</th>
        <th class="num">Lead W–L</th><th class="num">Assist W–L</th><th class="num">Total</th><th class="num">Win %</th></tr></thead>
        <tbody>${full}</tbody></table></div></div>`;
};

/* ── Schedule ───────────────────────────────────────────────────── */
V.schedule = () => {
  const rows = D.weeks.map(w=>{
    const done = !!w.r1;
    const res = !done ? '<span style="color:var(--ink-3)">not played</span>'
      : (w.r1===w.r2 ? `<span class="tag ${w.r1==='A'?'usa':'csa'}">2–0 ${w.r1==='A'?'Team A':'Team B'}</span>`
                     : `<span class="tag q">1–1 split</span>`);
    // A played night opens its matchup; an unplayed one opens the builder —
    // the schedule IS the week list, so creating and reading live in one place.
    return `<tr class="click" data-go="${done?'week':'night'}" data-id="${w.n-1}">
      <td style="color:var(--ink-3)">${w.playoffs?'PO':'W'+w.n}</td>
      <td class="nm">${esc(w.name)}</td>
      <td class="nm">${esc(w.leadA||'—')} <span style="color:var(--ink-3)">vs</span> ${esc(w.leadB||'—')}</td>
      <td style="color:var(--ink-2)">${esc(w.m1||'—')}</td>
      <td style="color:var(--ink-2)">${esc(w.m2||'—')}</td>
      <td class="num">${w.a.length}v${w.b.length}</td>
      <td>${res}</td>
      <td><button class="gh" data-go="night" data-id="${w.n-1}">Edit</button></td></tr>`;
  }).join('');
  return `<div class="panel"><header class="ph"><h2>Schedule</h2><i class="rule"></i>
    <span class="meta">${D.weeks.length} nights</span></header>
    <div class="ctl"><button class="gh" data-go="night" data-id="${D.weeks.length-1}">＋ New night</button>
      <button class="gh" data-go="simulator" data-id="x">Generate a season</button>
      <i class="rule"></i>
      <span class="meta">a played night opens its matchup · Edit opens the builder</span></div>
    <div class="pb flush scroll-x"><table>
      <thead><tr><th></th><th>Night</th><th>Leads</th><th>Round 1 map</th><th>Round 2 map</th><th class="num">Sides</th><th>Result</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
};

/* ── Week night matchup ─────────────────────────────────────────── */
V.week = () => {
  const w = D.weeks[state.week];
  const aW = (w.r1==='A'?1:0)+(w.r2==='A'?1:0), bW = 2-aW;
  const cA = (w.casA[0]||0)+(w.casA[1]||0), cB = (w.casB[0]||0)+(w.casB[1]||0);
  const pts = (side) => {
    const lead = side==='A'?w.leadA:w.leadB, n = (side==='A'?w.a:w.b).length;
    const wins = side==='A'?aW:bW;
    const P = D.season.pointSystem;
    const leadPts = wins*P.winLead + (2-wins)*P.lossLead;
    const asstPts = wins*P.winAssist + (2-wins)*P.lossAssist + (wins===2?P.bonus2_0Assist:0);
    return {lead, leadPts, asstPts, n};
  };
  const pA = pts('A'), pB = pts('B');
  const sel = D.weeks.map((x,i)=>`<option value="${i}"${i===state.week?' selected':''}>${esc(x.name)}</option>`).join('');

  // Units absent from the standings are non-token: they field men but score nothing.
  const scores = new Set(D.standings.map(r=>r.unit));
  const rosters = ['A','B'].map(s=>{
    const units = s==='A'?w.a:w.b, lead = s==='A'?w.leadA:w.leadB;
    const nonTok = units.filter(u=>!scores.has(u));
    return `<div class="col ${s==='A'?'stripe-usa':'stripe-csa'}">
      <div class="cap" style="margin-bottom:7px">Team ${s} · ${units.length} units</div>
      <div class="rl">${units.map(u=>{
        const isLead = u===lead, tok = scores.has(u);
        const style = isLead ? 'border-color:var(--ink);color:var(--ink);font-weight:600'
                    : tok ? '' : 'opacity:.5;border-style:dashed';
        return `<span class="tag q" style="${style}" title="${tok?'':'non-token — fields men, scores no points'}">${esc(u)}${isLead?' ★':''}</span>`;
      }).join('')}</div>
      <div class="note" style="margin-top:9px">★ lead · ${s==='A'?pA.leadPts:pB.leadPts} pts to the lead, ${s==='A'?pA.asstPts:pB.asstPts} to each assist${nonTok.length?` · ${nonTok.length} non-token (dashed) score nothing`:''}</div></div>`;
  }).join('');

  const rounds = [1,2].map(r=>{
    const win = r===1?w.r1:w.r2, map = r===1?w.m1:w.m2, flip = r===1?w.f1:w.f2;
    const ca = w.casA[r-1], cb = w.casB[r-1];
    if(!win) return '';
    // Only rounds with an imported scoreboard can open the round matchup.
    const mi = D.matchups.findIndex(m=>m.week===w.name && m.rd===r);
    const open = mi >= 0;
    return `<div class="col${open?' click-col':''}"${open?` data-go="round" data-id="${mi}" role="button" tabindex="0"`:''}>
      <div style="display:flex;align-items:baseline;gap:8px"><span class="cap">Round ${r}</span>
        <i class="rule"></i><span class="tag ${win==='A'?'usa':'csa'}">Team ${win}</span></div>
      <div class="nm" style="margin-top:6px;font-size:13px">${esc(map)}</div>
      <div class="note" style="margin-top:3px">${flip?'sides flipped · ':''}Team A ${ca==null?'—':ca} casualties · Team B ${cb==null?'—':cb}</div>
      ${ca!=null&&cb!=null?`<div class="stack" style="margin-top:8px"><i style="width:${pc(cb,ca+cb)}%;background:var(--union)"></i><i style="flex:1;background:var(--reb)"></i></div>
      <div class="leg"><span>Team A inflicted ${cb}</span><span>Team B inflicted ${ca}</span></div>`:''}
      <div class="note" style="margin-top:9px;${open?'color:var(--live)':''}">${open?'Open the round matchup →':'No scoreboard imported for this round'}</div></div>`;
  }).join('');

  return `
    <div class="panel">
      <div class="ctl"><span class="cap">Night</span>
        <select id="wk-pick">${sel}</select>
        ${w.playoffs?'<span class="tag q">Playoff night</span>':''}
        <i class="rule"></i><span class="meta cap">${esc(w.name)}</span></div>
      ${scoreline(
        {tag:'<span class="tag usa">Team A</span>', name:w.leadA?`${w.leadA} leading`:'No lead recorded', val:aW, sub:`rounds won · ${cA} casualties taken`, cls:'f-usa'},
        {tag:'<span class="tag csa">Team B</span>', name:w.leadB?`${w.leadB} leading`:'No lead recorded', val:bW, sub:`rounds won · ${cB} casualties taken`, cls:'f-csa'},
        aW>bW?'A':bW>aW?'B':'', aW===bW?'Split':'Final')}
      ${stripebar(aW||0.02, bW||0.02,'union','reb')}
    </div>
    ${panel('Rounds', 'two rounds make a night', `<div class="cols">${rounds}</div>`, true)}
    ${panel('The night in numbers','', spine([
        {label:'Rounds won', a:aW, b:bW},
        {label:'Casualties inflicted', sub:'enemy men lost', a:cB, b:cA},
        {label:'Casualties taken', sub:'lower is better', a:cA, b:cB, lower:true},
        {label:'Units fielded', a:w.a.length, b:w.b.length},
        {txt:true, label:'Lead unit', a:w.leadA||'—', b:w.leadB||'—'},
      ],'usa','csa'), true)}
    ${panel('Rosters', 'lead marked ★', `<div class="cols">${rosters}</div>`, true)}`;
};

/* ── Playoffs ───────────────────────────────────────────────────── */
V.playoffs = () => {
  const qual = D.divisions.map(dv=>{
    const rows = D.standings.filter(r=>r.div===dv.name).slice(0,4);
    return `<div class="col"><div class="cap" style="margin-bottom:7px">${esc(dv.name)} · qualifiers</div>
      ${rows.map((r,i)=>`<div class="bteam ${i<2?'win':''}" style="border:1px solid var(--line);margin-top:5px">
        <span><span class="pos">${i+1}</span> <span class="nm">${esc(r.unit)}</span></span>
        <span class="s">${r.points} pts · ${r.w}–${r.l}</span></div>`).join('')}
      <div class="note" style="margin-top:9px">Top two qualify. Seeds 3–4 take wildcard seats if the field expands.</div></div>`;
  }).join('');

  const slots = D.bracket.map((b,i)=>{
    const aW = (b.r1==='A'?1:0)+(b.r2==='A'?1:0), bW = (b.r1==='B'?1:0)+(b.r2==='B'?1:0);
    const stage = i===D.bracket.length-1 ? 'Final' : `Round ${i+1}`;
    return `<div class="bslot">
      <div style="display:flex;align-items:baseline;gap:8px"><span class="cap">${stage}</span><i class="rule"></i>
        <span class="meta">${esc(b.name.split(' - ')[0])}</span></div>
      <div class="bpair">
        <div class="bteam ${aW>bW?'win':''}"><span class="nm">${esc(b.a)}</span><span class="s">${aW}</span></div>
        <div class="bteam ${bW>aW?'win':''}"><span class="nm">${esc(b.b)}</span><span class="s">${bW}</span></div>
      </div>
      <div class="note" style="margin-top:6px">${esc(b.m1||'—')}${b.m2?` · ${esc(b.m2)}`:''}</div></div>`;
  }).join('');

  return `
    ${panel('Bracket', `${D.bracket.length} playoff nights`, `<div class="bracket">${slots}</div>`, true)}
    ${panel('Qualification', 'as the standings sit', `<div class="cols">${qual}</div>`, true)}
    ${panel('Format audit','what these settings actually draw',
      `<div class="prose">
        <p>Four qualifiers, single elimination, best of two rounds a night. That is <b>three series</b> over
        <b>${D.bracket.length} nights</b> — one spare night against a decider.</p>
        <p>A round hosts one matchup, because each side has one lead, and a night is two rounds. So a night
        fits two matchups, and that — not the number of stages — is what sets the length.</p>
        <p class="note">Widening to eight qualifiers is seven series: 5–7 nights with single-round quarterfinals,
        7–11 at best of three throughout.</p></div>`)}`;
};

/* ── Stats overview ─────────────────────────────────────────────── */
V.overview = () => {
  const s = D.season;
  const usa = D.matchups.filter(m=>m.winner==='USA').length;
  const kpis = [['Rounds imported', s.roundsImported, `of ${s.roundsPlayed} played`],
    ['USA wins', usa, `${pc(usa,D.matchups.length)}% of rounds`],
    ['CSA wins', D.matchups.length-usa, `${100-pc(usa,D.matchups.length)}%`],
    ['Players', s.players, 'unique by steam id'],
    ['Units seen', D.regiments.length, 'matched to the registry'],
    ['Kills', s.kills.toLocaleString(), 'from the killfeed']]
    .map(([h,v,x])=>`<div class="kpi"><div class="cap">${h}</div><div class="v">${v}</div><div class="h">${x}</div></div>`).join('');

  const lead = (title, rows, fmt) => `<div class="col"><div class="cap" style="margin-bottom:7px">${title}</div>
    ${rows.map((r,i)=>`<div class="bteam" style="border-bottom:1px solid var(--line);padding:5px 0">
      <span><span class="pos ${i===0?'q':''}">${i+1}</span> <button class="nm" data-go="player" data-id="${esc(r.id)}" style="text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px">${esc(bare(r.name))}</button>
      <span class="tag q">${esc(r.unit)}</span></span>
      <span class="s" style="font-weight:600;color:var(--ink)">${fmt(r)}</span></div>`).join('')}</div>`;

  const byK = D.leaderboard.slice(0,5);
  const byKd = D.leaderboard.filter(p=>p.rounds>=8).slice().sort((a,b)=>b.kd-a.kd).slice(0,5);
  const byTd = D.leaderboard.filter(p=>p.d>=15).slice().sort((a,b)=>a.td-b.td).slice(0,5);

  return `
    ${panel('Imported stats', `${esc(s.name)}`, `<div class="kpis">${kpis}</div>`, true)}
    ${panel('Leaders', 'minimum rounds applied where it matters',
      `<div class="cols">${lead('Most kills',byK,r=>r.k)}${lead('Best K/D · 8+ rounds',byKd,r=>n2(r.kd))}${lead('Cheapest deaths · 15+',byTd,r=>n1(r.td))}</div>`, true)}
    ${panel('Latest rounds','click through to the matchup',
      `<div class="scroll-x"><table><thead><tr><th>Night</th><th>Rd</th><th>Map</th><th>Winner</th>
       <th class="num">USA cas</th><th class="num">CSA cas</th><th class="num">Men</th><th class="num">Length</th></tr></thead>
      <tbody>${D.matchups.slice(-6).reverse().map(m=>{
        const i = D.matchups.indexOf(m);
        return `<tr class="click" data-go="round" data-id="${i}">
        <td style="color:var(--ink-3)" class="nm">${esc(m.week.split(' - ')[1]||m.week)}</td>
        <td>${m.rd}</td><td class="nm">${esc(m.map)}</td>
        <td><span class="tag ${m.winner.toLowerCase()}">${m.winner}</span></td>
        <td class="num">${m.cas.USA.total}</td><td class="num">${m.cas.CSA.total}</td>
        <td class="num" style="color:var(--ink-3)">${m.pop.peak}</td><td class="num" style="color:var(--ink-3)">${dur(m.dur)}</td></tr>`;
      }).join('')}</tbody></table></div>`)}`;
};

/* ── Round matchup ──────────────────────────────────────────────── */
V.round = () => {
  const m = D.matchups[state.round], U = m.cas.USA, C = m.cas.CSA;
  const uT = tix(U), cT = tix(C), usaWon = m.winner==='USA';
  const sel = D.matchups.map((x,i)=>`<option value="${i}"${i===state.round?' selected':''}>${esc(x.week)} · R${x.rd} · ${esc(x.map)}</option>`).join('');
  const men = f => m.units[f].reduce((s,u)=>s+u.n,0);

  const SIDE = {USA:{c:U,cl:'usa',adj:'Union',noun:'the Union'},CSA:{c:C,cl:'csa',adj:'Confederate',noun:'the Confederacy'}};
  const win = {t:m.winner,...SIDE[m.winner]}, los = {t:usaWon?'CSA':'USA',...SIDE[usaWon?'CSA':'USA']};
  const wU = m.units[win.t], top = wU[0], next = wU[1];
  const ool = los.c.oob*TW.oob;
  const cap = s => s[0].toUpperCase()+s.slice(1);
  const keys = [
    [win.cl, win.adj+' discipline',
     `<b>${pc(win.c.inForm,win.c.total)}%</b> of ${win.adj} losses came in formation against <b>${pc(los.c.inForm,los.c.total)}%</b> for ${los.noun}. A death in formation costs one ticket; the rest cost three or five.`],
    [los.cl, 'Caught out of line',
     `${cap(los.noun)} lost <b>${los.c.oob}</b> men out of line — <b>${ool}</b> tickets, <b>${pc(ool,tix(los.c))}%</b> of everything given up, off <b>${pc(los.c.oob,los.c.total)}%</b> of the casualties.`],
    [win.cl, (top?top.unit:'—')+' carried it',
     top?`<b>${top.tdiPct}%</b> of ${win.adj} ticket damage off <b>${top.n}</b> men at <b>${n2(top.kd)}</b> K/D${next?`. The next ${win.adj} unit managed <b>${next.tdiPct}%</b>`:''}.`:'—'],
    ['', 'The margin',
     (()=>{ // ticket damage each side DEALT = the other side's stance-weighted loss
       const wDealt = win.t==='USA'?cT:uT, lDealt = win.t==='USA'?uT:cT;
       return wDealt >= lDealt
         ? `${cap(win.noun)} won the ticket exchange <b>${wDealt}</b> to <b>${lDealt}</b> — a <b>${wDealt-lDealt}</b>-ticket margin over ${dur(m.dur)}.`
         : `${cap(win.noun)} won on bodies, not tickets: <b>${win.c.total<los.c.total?'more men killed':'the casualty count'}</b>, but the heavier ticket loss — <b>${lDealt}</b> dealt against <b>${wDealt}</b>. Cheap deaths in formation covered the gap.`;
     })()],
  ].map(([c,t,b])=>`<div class="col"><div style="display:flex;align-items:center;gap:7px">
      <span class="tag ${c||'q'}">${c?c.toUpperCase():'Round'}</span><strong>${esc(t)}</strong></div>
      <div class="prose" style="margin-top:6px;font-size:11.5px">${b}</div></div>`).join('');

  const unitCols = ['USA','CSA'].map(f=>{
    const mx = Math.max(...m.units[f].map(u=>u.tdiPct))||1;
    return `<div class="col ${f==='USA'?'stripe-usa':'stripe-csa'}">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">
        <span class="tag ${f.toLowerCase()}">${f}</span><span class="cap">ticket damage dealt</span></div>
      ${m.units[f].slice(0,6).map(u=>`<div class="hb"><span class="nm">${esc(u.unit)}</span>
        <span class="t"><i style="width:${u.tdiPct/mx*100}%;background:var(--${f==='USA'?'union':'reb'})"></i></span>
        <span class="n">${u.tdiPct}%</span></div>`).join('')}</div>`;
  }).join('');

  const topCols = ['USA','CSA'].map(f=>`<div class="col" style="padding:0">
    <div style="display:flex;align-items:center;gap:7px;padding:12px 13px 8px">
      <span class="tag ${f.toLowerCase()}">${f}</span><span class="cap">most kills</span></div>
    <div class="scroll-x"><table><thead><tr><th></th><th>Player</th><th>Unit</th>
      <th class="num">K</th><th class="num">D</th><th class="num">K/D</th></tr></thead>
    <tbody>${m.top[f].slice(0,6).map((p,i)=>`<tr>
      <td><span class="pos ${i===0?'q':''}">${i+1}</span></td>
      <td class="nm">${esc(bare(p.name))}</td><td><span class="tag q">${esc(p.unit)}</span></td>
      <td class="num">${p.k}</td><td class="num">${p.d}</td><td class="num">${n2(p.kd)}</td></tr>`).join('')}
    </tbody></table></div></div>`).join('');

  return `
    <div class="panel">
      <div class="ctl"><span class="cap">Round</span><select id="rd-pick">${sel}</select>
        <i class="rule"></i>
        <span class="meta cap">${esc(m.map)} · ${dur(m.dur)}${m.flipped?' · sides flipped':''}</span></div>
      ${scoreline(
        {tag:`<span class="tag usa">Union</span>`, name:m.leadUSA?`USA · ${m.leadUSA}`:'USA', val:C.total, sub:`casualties inflicted · ${men('USA')} men`, cls:'f-usa'},
        {tag:`<span class="tag csa">Confederate</span>`, name:m.leadCSA?`CSA · ${m.leadCSA}`:'CSA', val:U.total, sub:`casualties inflicted · ${men('CSA')} men`, cls:'f-csa'},
        usaWon?'A':'B','Final')}
      ${stripebar(C.total,U.total,'union','reb')}
    </div>
    ${panel('How the round was won','one line per metric', spine([
      {label:'Casualties inflicted', sub:'enemy men lost', a:C.total, b:U.total},
      {label:'Casualties taken', sub:'lower is better', a:U.total, b:C.total, lower:true},
      {label:'Ticket damage dealt', sub:'stance weighted', a:cT, b:uT},
      {label:'Held the line', sub:'% of losses, in formation', a:pc(U.inForm,U.total), b:pc(C.inForm,C.total), af:pc(U.inForm,U.total)+'%', bf:pc(C.inForm,C.total)+'%'},
      {label:'Caught out of line', sub:'% of losses · lower better', a:pc(U.oob,U.total), b:pc(C.oob,C.total), af:pc(U.oob,U.total)+'%', bf:pc(C.oob,C.total)+'%', lower:true},
      {label:'Cost per death', sub:'tickets, lower better', a:uT/U.total, b:cT/C.total, af:n1(uT/U.total), bf:n1(cT/C.total), lower:true},
      {label:'Melee deaths', sub:'lost at bayonet point', a:m.weapons.USA.Melee||0, b:m.weapons.CSA.Melee||0, lower:true},
      {label:'Artillery deaths', sub:'canister · shell · round shot', a:(m.weapons.USA.Canister||0)+(m.weapons.USA.Shell||0)+(m.weapons.USA['Round Shot']||0), b:(m.weapons.CSA.Canister||0)+(m.weapons.CSA.Shell||0)+(m.weapons.CSA['Round Shot']||0), lower:true},
    ],'usa','csa'), true)}
    ${panel('Keys to the round','written from the numbers above', `<div class="cols">${keys}</div>`, true)}
    ${panel('Who did the damage','', `<div class="cols">${unitCols}</div>`, true)}
    ${panel('Top of the field','', `<div class="cols">${topCols}</div>`, true)}`;
};

/* ── Rounds list ────────────────────────────────────────────────── */
V.rounds = () => `<div class="panel"><header class="ph"><h2>Imported rounds</h2><i class="rule"></i>
  <span class="meta">${D.matchups.length} scoreboards</span></header>
  <div class="pb flush scroll-x"><table>
    <thead><tr><th>Night</th><th class="num">Rd</th><th>Map</th><th>Winner</th><th>Leads</th>
    <th class="num">USA cas</th><th class="num">CSA cas</th><th class="num">Men</th><th class="num">Length</th><th>Bound</th></tr></thead>
    <tbody>${D.matchups.slice().reverse().map(m=>{
      const i=D.matchups.indexOf(m);
      return `<tr class="click" data-go="round" data-id="${i}">
      <td class="nm" style="color:var(--ink-2)">${esc(m.week)}</td><td class="num">${m.rd}</td>
      <td class="nm">${esc(m.map)}</td><td><span class="tag ${m.winner.toLowerCase()}">${m.winner}</span></td>
      <td class="nm" style="color:var(--ink-2)">${esc(m.leadUSA||'—')} / ${esc(m.leadCSA||'—')}</td>
      <td class="num">${m.cas.USA.total}</td><td class="num">${m.cas.CSA.total}</td>
      <td class="num" style="color:var(--ink-3)">${m.pop.peak}</td>
      <td class="num" style="color:var(--ink-3)">${dur(m.dur)}</td>
      <td><span class="tag q">W${m.wk} R${m.rd}</span></td></tr>`;}).join('')}
  </tbody></table></div></div>`;

/* ── Players ────────────────────────────────────────────────────── */
const PC = [
  {k:'pos',h:''},{k:'name',h:'Player'},{k:'unit',h:'Unit'},
  {k:'rounds',h:'Rds',num:1},{k:'k',h:'Kills',num:1,bar:1},{k:'d',h:'Deaths',num:1},
  {k:'kd',h:'K/D',num:1,bar:1,f:n2},{k:'kpr',h:'K/rd',num:1,f:n1},
  {k:'td',h:'Cost / death',num:1,f:n1},{k:'tk',h:'Value / kill',num:1,f:n1},
];
V.players = () => {
  const BR = {all:'All', Infantry:'Infantry', Cavalry:'Cavalry', Artillery:'Artillery'};
  let rows = D.leaderboard.slice();
  if(state.pClass!=='all') rows = rows.filter(r=>r.branch===state.pClass);
  const K = state.pSort.k;
  rows.sort((a,b)=>{const av=a[K]??-1,bv=b[K]??-1;
    return typeof av==='string' ? av.localeCompare(bv)*state.pSort.d : (av-bv)*state.pSort.d;});
  const mx = k => Math.max(...D.leaderboard.map(r=>r[k]??0))||1;
  const head = PC.map(c=>c.k==='pos'?'<th></th>':
    `<th class="${c.num?'num ':''}s" data-k="${c.k}" ${state.pSort.k===c.k?`aria-sort="${state.pSort.d<0?'descending':'ascending'}"`:''}>${c.h}${state.pSort.k===c.k?(state.pSort.d<0?' ▾':' ▴'):''}</th>`)
    .join('') + '<th>In game</th>';
  const row = (r,i)=>`<tr class="click" data-go="player" data-id="${esc(r.id)}">`+
    PC.map(c=>{
      if(c.k==='pos') return `<td><span class="pos ${i<=3?'q':''}">${i}</span></td>`;
      if(c.k==='name') return `<td class="nm">${esc(bare(r.name))}</td>`;
      if(c.k==='unit') return `<td><span class="tag q">${esc(r.unit)}</span></td>`;
      const v = c.f?c.f(r[c.k]):r[c.k];
      if(c.bar && state.pSort.k===c.k) return `<td class="num"><span style="display:inline-block;width:40px;height:5px;background:var(--sunken);vertical-align:middle;margin-right:7px"><i style="display:block;height:100%;width:${(r[c.k]??0)/mx(c.k)*100}%;background:var(--ink)"></i></span>${v}</td>`;
      return `<td class="num"${c.k==='td'||c.k==='tk'?' style="color:var(--ink-2)"':''}>${v}</td>`;
    }).join('') +
    `<td style="color:var(--ink-2)"><span class="tag q">${esc(r.branch)}</span> ${esc(r.igReg)}</td></tr>`;
  const counts = Object.keys(BR).reduce((o,k)=>(o[k]= k==='all'?D.leaderboard.length:D.leaderboard.filter(r=>r.branch===k).length, o),{});

  return `<div class="panel">
    <header class="ph"><h2>Player leaderboard</h2><i class="rule"></i>
      <span class="meta">${rows.length} player${rows.length===1?'':'s'}</span></header>
    <div class="ctl">
      <span class="cap">Branch</span>
      <div class="seg" id="p-class">${Object.entries(BR).map(([k,l])=>
        `<button data-c="${k}" aria-pressed="${state.pClass===k}">${l} ${counts[k]}</button>`).join('')}</div>
      <button class="gh" id="p-gb" aria-pressed="false" aria-controls="p-gloss">What do these mean?</button>
      <i class="rule"></i>
      <span class="meta">branch comes from the in-game regiment</span></div>
    <div class="gloss" id="p-gloss">
      <dl><dt>K/D</dt><dd>Kills ÷ deaths over every imported round.</dd></dl>
      <dl><dt>Cost per death <span style="color:var(--ink-3)">(×Td)</span></dt><dd>Tickets each death cost the team. In formation 1, skirmishing 3, out of line 5. Lower is better.</dd></dl>
      <dl><dt>Value per kill <span style="color:var(--ink-3)">(×Tk)</span></dt><dd>Tickets each kill drained, weighted by where the victim died. Higher is better.</dd></dl>
      <dl><dt>Cavalry</dt><dd>Anyone whose in-game regiment is ${esc(D.config.cavalryRegiments.join(', '))}. Artillery is any battery.</dd></dl>
    </div>
    <div class="pb">${paged('lb', rows, head, row,
      r=>`${r.name} ${r.unit} ${r.id} ${r.igReg} ${r.branch}`,
      {ph:'player, unit, steam id or in-game regiment', size:12})}</div>
  </div>`;
};

/* ── Player card ────────────────────────────────────────────────── */
const rankOf = (id,k,low) => D.leaderboard.slice()
  .sort((a,b)=>low?(a[k]??9e9)-(b[k]??9e9):(b[k]??-1)-(a[k]??-1)).findIndex(r=>r.id===id)+1;

V.player = () => {
  const p = D.leaderboard.find(r=>r.id===state.player) || D.leaderboard[0];
  const T = D.leaderboard.length;
  const sel = D.leaderboard.map(x=>`<option value="${x.id}"${x.id===p.id?' selected':''}>${esc(bare(x.name))} — ${esc(x.unit)}</option>`).join('');
  const S = [['Kills',p.k,rankOf(p.id,'k'),`${n1(p.kpr)} per round`],
    ['Deaths',p.d,rankOf(p.id,'d',true),`${n1(p.dpr)} per round`],
    ['K/D',n2(p.kd),rankOf(p.id,'kd'),'kills ÷ deaths'],
    ['Cost per death',n1(p.td),rankOf(p.id,'td',true),'tickets · ×Td'],
    ['Value per kill',n1(p.tk),rankOf(p.id,'tk'),'tickets · ×Tk']]
    .map(([h,v,r,x])=>`<div class="kpi"><div class="cap">${h}</div><div class="v">${v}</div>
      <div class="h"><b style="color:var(--ink-2)">${ord(r)}</b> of ${T} · ${x}</div>
      <div class="pctbar"><i style="width:${(1-(r-1)/T)*100}%"></i></div></div>`).join('');

  const log = p.log.slice().reverse(), mk = Math.max(...log.map(r=>r.k))||1;
  const wins = log.filter(r=>r.win).length;

  return `<div class="panel">
    <div class="ctl"><span class="cap">Player</span><select id="pl-pick">${sel}</select>
      <i class="rule"></i><span class="meta cap">${esc(p.id)}</span></div>
    <div style="padding:16px 16px 12px;display:flex;align-items:baseline;gap:11px;flex-wrap:wrap">
      <span class="mid nm">${esc(bare(p.name))}</span>
      <button class="tag q" data-go="unit" data-id="${esc(p.unit)}">${esc(p.unit)}</button>
      <span class="tag q">${esc(p.branch)}</span>
      <span class="cap">${esc(p.igReg)} · ${esc(p.igCo)} · ${esc(p.igRank)} ${esc(p.igClass)} · ${p.rounds} rounds</span></div>
    <div class="kpis" style="border-top:1px solid var(--line)">${S}</div>
  </div>
  ${panel('Form',`${wins}\u2013${log.length-wins} across ${log.length} rounds · most recent right`,
    `<div class="form">${log.map(r=>`<i class="${r.win?'w':''}" style="height:${Math.max(4,r.k/mk*34)}px" title="${esc(r.week)} R${r.rd} · ${esc(r.map)} — ${r.k}K ${r.d}D"></i>`).join('')}</div>
     <div class="leg"><span><i style="background:var(--ink)"></i>won</span>
     <span><i style="background:var(--ink);opacity:.2"></i>lost</span><span>bar height = kills</span></div>`)}
  ${panel('Discipline','where the kills and the deaths happened',
    `<div class="cols"><div class="col">${stanceStack(p.dif,p.dsk,p.dob,'His own deaths')}</div>
     <div class="col">${stanceStack(p.kif,p.ksk,p.kob,'Where his victims died')}</div></div>`, true)}
  ${panel('Weapons','',
    `<div class="cols"><div class="col"><div class="cap">Killed with</div>${hbars(Object.entries(p.kc),p.k)}</div>
     <div class="col"><div class="cap">Died to</div>${hbars(Object.entries(p.dc),p.d)}</div></div>`, true)}
  <div class="panel"><header class="ph"><h2>Game log</h2><i class="rule"></i><span class="meta">${log.length} rounds</span></header>
    <div class="pb flush scroll-x"><table>
      <thead><tr><th></th><th>Night</th><th class="num">Rd</th><th>Map</th><th>Side</th>
      <th class="num">K</th><th class="num">D</th><th class="num">K/D</th>
      <th class="num">Cost</th><th class="num">Value</th><th>Result</th></tr></thead>
      <tbody>${p.log.map((r,i)=>`<tr class="click" data-go="roundName" data-id="${esc(r.week)}|${r.rd}">
        <td style="color:var(--ink-3)">${p.log.length-i}</td>
        <td class="nm" style="color:var(--ink-2)">${esc(r.week)}</td><td class="num">${r.rd}</td>
        <td class="nm">${esc(r.map)}</td><td><span class="tag ${r.team.toLowerCase()}">${r.team}</span></td>
        <td class="num">${r.k}</td><td class="num">${r.d}</td><td class="num">${n2(r.kd)}</td>
        <td class="num" style="color:var(--ink-2)">${n1(r.td)}</td><td class="num" style="color:var(--ink-2)">${n1(r.tk)}</td>
        <td style="font-weight:${r.win?600:400};color:${r.win?'var(--ink)':'var(--ink-3)'}">${r.win?'Won':'Lost'}</td></tr>`).join('')}
      </tbody></table></div></div>`;
};

/* ── Regiments ──────────────────────────────────────────────────── */
const RC = [{k:'pos',h:''},{k:'unit',h:'Unit'},{k:'div',h:'Div'},{k:'rounds',h:'Rds',num:1},
  {k:'men',h:'Men',num:1},{k:'avg',h:'Avg/rd',num:1,f:n1},{k:'k',h:'Kills',num:1},{k:'d',h:'Deaths',num:1},
  {k:'kd',h:'K/D',num:1,bar:1,f:n2},{k:'kr',h:'Kills / man',num:1,f:n2},{k:'lr',h:'Losses / man',num:1,f:n2},
  {k:'tdi',h:'Dmg dealt',num:1,f:v=>v+'%'},{k:'tdr',h:'Dmg taken',num:1,f:v=>v+'%'}];
V.regiments = () => {
  const rows = D.regiments.slice().sort((a,b)=>{
    const K=state.rSort.k, av=a[K]??-1, bv=b[K]??-1;
    return typeof av==='string'?av.localeCompare(bv)*state.rSort.d:(av-bv)*state.rSort.d;});
  const mx = Math.max(...D.regiments.map(r=>r.kd))||1;
  const head = RC.map(c=>c.k==='pos'?'<th></th>':
    `<th class="${c.num?'num ':''}s" data-k="${c.k}" ${state.rSort.k===c.k?`aria-sort="${state.rSort.d<0?'descending':'ascending'}"`:''}>${c.h}${state.rSort.k===c.k?(state.rSort.d<0?' ▾':' ▴'):''}</th>`).join('')
    + '<th>Branch mix</th>';
  const row = (r,i)=>`<tr class="click" data-go="unit" data-id="${esc(r.unit)}">`+RC.map(c=>{
    if(c.k==='pos') return `<td><span class="pos ${i<=3?'q':''}">${i}</span></td>`;
    if(c.k==='unit') return `<td class="nm">${esc(r.unit)}</td>`;
    if(c.k==='div') return `<td><span class="tag q">${esc(r.div)}</span></td>`;
    const v = c.f?c.f(r[c.k]):r[c.k];
    if(c.bar) return `<td class="num"><span style="display:inline-block;width:38px;height:5px;background:var(--sunken);vertical-align:middle;margin-right:7px"><i style="display:block;height:100%;width:${r[c.k]/mx*100}%;background:var(--ink)"></i></span>${v}</td>`;
    return `<td class="num"${['tdi','tdr','kr','lr'].includes(c.k)?' style="color:var(--ink-2)"':''}>${v}</td>`;
  }).join('') + `<td style="color:var(--ink-2)">${Object.entries(r.branchMix||{}).map(([k,v])=>`${k.slice(0,3)} ${v}`).join(' · ')||'—'}</td></tr>`;

  return `<div class="panel">
    <header class="ph"><h2>Units</h2><i class="rule"></i><span class="meta">${rows.length} matched · sortable</span></header>
    <div class="ctl"><span class="cap">Compare two units</span>

      <select id="ru-b">${D.regiments.map((r,i)=>`<option value="${esc(r.unit)}"${i===1?' selected':''}>${esc(r.unit)}</option>`).join('')}</select>
      <button class="gh" id="ru-go">Open comparison</button>
      <i class="rule"></i><span class="meta">click a unit for its card</span></div>
    <div class="pb">${paged('regs', rows, head, row, r=>`${r.unit} ${r.div}`, {ph:'unit or division', size:10})}</div>
  </div>`;
};

/* ── Regiment card ──────────────────────────────────────────────── */
V.unit = () => {
  const r = D.regiments.find(x=>x.unit===state.unit) || D.regiments[0];
  const st = D.standings.find(x=>x.unit===r.unit);
  const sel = D.regiments.map(x=>`<option value="${esc(x.unit)}"${x.unit===r.unit?' selected':''}>${esc(x.unit)}</option>`).join('');
  const T = D.regiments.length;
  const rk = (k,low)=>D.regiments.slice().sort((a,b)=>low?a[k]-b[k]:b[k]-a[k]).findIndex(x=>x.unit===r.unit)+1;
  const S=[['Points',st?st.points:'—',st?st.pos:'—',st?`${st.w}–${st.l} on the night`:'not in standings',D.standings.length],
    ['K/D',n2(r.kd),rk('kd'),`${r.k} kills · ${r.d} losses`,T],
    ['Kills per man',n2(r.kr),rk('kr'),'size-normalised output',T],
    ['Losses per man',n2(r.lr),rk('lr',true),'lower is better',T],
    ['Damage dealt',r.tdi+'%',rk('tdi'),'avg share of its side',T],
    ['Damage taken',r.tdr+'%',rk('tdr',true),'lower is better',T]]
    .map(([h,v,p,x,t])=>`<div class="kpi"><div class="cap">${h}</div><div class="v">${v}</div>
      <div class="h"><b style="color:var(--ink-2)">${typeof p==='number'?ord(p):p}</b> of ${t} · ${x}</div>
      <div class="pctbar"><i style="width:${typeof p==='number'?(1-(p-1)/t)*100:0}%"></i></div></div>`).join('');

  return `<div class="panel">
    <div class="ctl"><span class="cap">Unit</span><select id="un-pick">${sel}</select>
      <i class="rule"></i><span class="meta cap">${esc(r.div)} division · ${r.rounds} rounds · ${r.men} men seen</span></div>
    <div style="padding:16px 16px 12px;display:flex;align-items:baseline;gap:11px;flex-wrap:wrap">
      <span class="mid nm">${esc(r.unit)}</span>
      <span class="tag q">${esc(r.div)}</span>
      <span class="cap">avg ${n1(r.avg)} men fielded a round</span></div>
    <div class="kpis" style="border-top:1px solid var(--line)">${S}</div></div>
  ${panel('Discipline','the unit\'s whole record',
    `<div class="cols"><div class="col">${stanceStack(r.dif,r.dsk,r.dob,'Losses by stance')}</div>
     <div class="col">${stanceStack(r.kif,r.ksk,r.kob,'Kills by victim stance')}</div></div>`, true)}
  <div class="panel"><header class="ph"><h2>Roster</h2><i class="rule"></i><span class="meta">top five by kills</span></header>
    <div class="pb flush scroll-x"><table>
      <thead><tr><th></th><th>Player</th><th class="num">Rds</th><th class="num">K</th><th class="num">D</th>
      <th class="num">K/D</th><th class="num">Cost</th><th class="num">Value</th></tr></thead>
      <tbody>${r.top.map((p,i)=>`<tr class="click" data-go="player" data-id="${esc(p.id)}">
        <td><span class="pos ${i===0?'q':''}">${i+1}</span></td><td class="nm">${esc(bare(p.name))}</td>
        <td class="num">${p.rounds}</td><td class="num">${p.k}</td><td class="num">${p.d}</td>
        <td class="num">${n2(p.kd)}</td><td class="num" style="color:var(--ink-2)">${n1(p.td)}</td>
        <td class="num" style="color:var(--ink-2)">${n1(p.tk)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
};

/* ── Compare ────────────────────────────────────────────────────── */
V.compare = () => {
  const a = D.leaderboard.find(x=>x.id===state.cmpA), b = D.leaderboard.find(x=>x.id===state.cmpB);
  const opts = who => D.leaderboard.map(x=>`<option value="${x.id}"${x.id===who?' selected':''}>${esc(bare(x.name))} — ${esc(x.unit)}</option>`).join('');
  const rows = [
    {label:'Rounds', a:a.rounds, b:b.rounds},
    {label:'Kills', a:a.k, b:b.k},
    {label:'Kills per round', a:a.kpr, b:b.kpr, af:n1(a.kpr), bf:n1(b.kpr)},
    {label:'Deaths', a:a.d, b:b.d, lower:true},
    {label:'Deaths per round', a:a.dpr, b:b.dpr, af:n1(a.dpr), bf:n1(b.dpr), lower:true},
    {label:'K/D', a:a.kd, b:b.kd, af:n2(a.kd), bf:n2(b.kd)},
    {label:'Cost per death', sub:'lower is better', a:a.td, b:b.td, af:n1(a.td), bf:n1(b.td), lower:true},
    {label:'Value per kill', sub:'higher is better', a:a.tk, b:b.tk, af:n1(a.tk), bf:n1(b.tk)},
    {label:'Died in formation', sub:'% of own deaths', a:pc(a.dif,a.d), b:pc(b.dif,b.d), af:pc(a.dif,a.d)+'%', bf:pc(b.dif,b.d)+'%'},
    {label:'Died out of line', sub:'% of own deaths', a:pc(a.dob,a.d), b:pc(b.dob,b.d), af:pc(a.dob,a.d)+'%', bf:pc(b.dob,b.d)+'%', lower:true},
    {label:'Melee kills', a:a.kc.Melee||0, b:b.kc.Melee||0},
  ];
  let aw=0, bw=0;
  rows.forEach(r=>{ if(r.a===r.b) return; const A = r.lower ? r.a<r.b : r.a>r.b; A?aw++:bw++; });
  const win = aw>=bw?a:b, los = aw>=bw?b:a, wn = Math.max(aw,bw);

  return `<div class="panel">
    <div class="ctl"><select id="c-a">${opts(a.id)}</select><span class="cap">versus</span>
      <select id="c-b">${opts(b.id)}</select><button class="gh" id="c-swap">Swap</button>
      <i class="rule"></i><span class="meta">same spine as a round matchup</span></div>
    ${scoreline(
      {tag:`<span class="tag q">${esc(a.unit)}</span>`, name:bare(a.name), val:n2(a.kd), sub:`K/D · ${ord(rankOf(a.id,'kd'))} of ${D.leaderboard.length}`},
      {tag:`<span class="tag q">${esc(b.unit)}</span>`, name:bare(b.name), val:n2(b.kd), sub:`K/D · ${ord(rankOf(b.id,'kd'))} of ${D.leaderboard.length}`},
      a.kd>=b.kd?'A':'B','K/D')}
  </div>
  ${panel('Head to head', `${wn} of ${rows.length} categories`, spine(rows,'ink','ink'), true)}
  ${panel('Read', '', `<div class="prose">
     <p><b>${esc(bare(win.name))}</b> takes ${wn} of ${rows.length}. ${n1(win.kpr)} kills a round against
     ${n1(los.kpr)}, dying ${n1(los.dpr/Math.max(win.dpr,.01))}× less often.</p>
     <p class="note">${win.td<los.td
       ? `Each of ${esc(bare(win.name))}'s deaths also costs the side ${n1(los.td-win.td)} fewer tickets — the discipline gap, not just the gunnery.`
       : `${esc(bare(los.name))} dies more cheaply though: ${n1(win.td-los.td)} fewer tickets a casualty.`}</p></div>`)}`;
};

/* ── Maps ───────────────────────────────────────────────────────── */

};

    <p><b>Acronyms explain themselves.</b> ×Td and ×Tk read as "cost per death" and "value per kill" in

/* ── Night builder ──────────────────────────────────────────────── */
const RT = ['Regular','Single round leads','Playoffs','Fun round'];
/** Round type drives everything below it: how many leads there are, whether the
 *  night scores, and whether it touches Elo and the map cooldown. */
const RT_RULES = {
  'Regular':            {leads:2, points:true,  elo:true,  cooldown:true,
    note:'One lead a side, both rounds. Two lead slots a night.'},
  'Single round leads': {leads:4, points:true,  elo:true,  cooldown:true,
    note:'Four leads a night — one per side per round. No unit leads both rounds.'},
  'Playoffs':           {leads:4, points:false, elo:true,  cooldown:true,
    note:'Leads per round, and no points are awarded. Elo still moves, at the playoff multiplier.'},
  'Fun round':          {leads:0, points:false, elo:false, cooldown:false,
    note:'Exhibition. No points, no Elo, and the maps played do not go on cooldown.'},
};

V.night = () => {
  const w = D.weeks[state.week];
  const type = state.roundType || (w.playoffs ? 'Playoffs' : 'Regular');
  const R = RT_RULES[type];
  const sel = D.weeks.map((x,i)=>`<option value="${i}"${i===state.week?' selected':''}>${esc(x.name)}</option>`).join('');
  const scores = new Set(D.standings.map(r=>r.unit));
  const all = D.config.registry.map(u=>u.name);
  const assigned = new Set([...w.a,...w.b]);
  const bench = all.filter(u=>!assigned.has(u));
  const heads = Object.fromEntries(D.config.registry.map(u=>[u.name,(u.min+u.max)/2]));
  const size = list => list.reduce((s,u)=>s+(heads[u]||0),0);

  const side = s => {
    const units = s==='A'?w.a:w.b, lead = s==='A'?w.leadA:w.leadB;
    // Regular = one lead for the night. Everything else = one per round.
    const leadFields = R.leads===0
      ? `<div class="note" style="margin-top:9px">Fun round — no lead is recorded.</div>`
      : R.leads===2
        ? pick(`Lead — Team ${s}`, ['—',...units], lead||'—', 'leads both rounds')
        : `<div class="grid-f" style="margin-top:9px">
             ${pick(`R1 lead — Team ${s}`, ['—',...units], lead||'—')}
             ${pick(`R2 lead — Team ${s}`, ['—',...units], units[1]||'—','must differ from R1')}
           </div>`;
    return `<div class="col ${s==='A'?'stripe-usa':'stripe-csa'}">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="tag ${s==='A'?'usa':'csa'}">Team ${s}</span>
        <span class="tag q">${s==='A'?'Home':'Away'}</span>
        <i class="rule"></i><span class="meta">${units.length} units</span></div>
      <div class="ostat" style="margin-top:9px">
        <span><b>${units.reduce((t,u)=>t+((D.config.registry.find(x=>x.name===u)||{}).min||0),0)}</b><i>min pop</i></span>
        <span><b>${units.reduce((t,u)=>t+((D.config.registry.find(x=>x.name===u)||{}).max||0),0)}</b><i>max pop</i></span>
        <span><b>${size(units).toFixed(0)}</b><i>avg pop</i></span>
        <span><b>${units.length?Math.round(units.reduce((t,u)=>t+((D.elo.ladder.find(x=>x.unit===u)||{}).elo||1500),0)/units.length):1500}</b><i>avg Elo</i></span>
      </div>
      <div style="margin-top:9px">${units.map(u=>`<div class="bteam" style="border:1px solid var(--line);margin-top:4px${scores.has(u)?'':';opacity:.55;border-style:dashed'}">
        <span><span class="nm">${esc(u)}</span>${u===lead&&R.leads?' <span class="tag q" style="border-color:var(--ink);color:var(--ink)">Lead ★</span>':''}</span>
        <span class="s">${heads[u]?`~${heads[u].toFixed(0)}`:'—'} <button class="gh" style="padding:1px 5px;margin-left:6px">→ ${s==='A'?'B':'A'}</button></span></div>`).join('')}</div>
      ${R.leads===2?`<div style="margin-top:9px">${leadFields}</div>`:leadFields}</div>`;
  };

  const round = r => {
    const win = r===1?w.r1:w.r2, map = r===1?w.m1:w.m2, flip = r===1?w.f1:w.f2;
    return `<div class="col">
      <div style="display:flex;align-items:center;gap:8px"><span class="cap">Round ${r}</span><i class="rule"></i>
        ${win?`<span class="tag ${win==='A'?'usa':'csa'}">Team ${win}</span>`:'<span class="meta">not played</span>'}</div>
      <div class="grid-f" style="margin-top:9px">
        ${pick('Map', [map||'—', ...D.maps.slice(0,8).map(m=>m.map)], map||'—', R.cooldown?`maps from the last ${D.config.mapCooldown} weeks are hidden`:'cooldown does not apply')}
        ${pick('Winner', ['Not played','Team A','Team B'], win==='A'?'Team A':win==='B'?'Team B':'Not played')}
        ${field('Casualties — A', w.casA[r-1] == null ? '' : w.casA[r-1])}
        ${field('Casualties — B', w.casB[r-1] == null ? '' : w.casB[r-1])}
      </div>
      <div style="margin-top:7px">${check('Sides flipped this round', flip, 'Team A played CSA')}</div>
      <div style="margin-top:9px"><div class="cap">Balance swaps</div>
        <div class="tgs" style="margin-top:6px">${[...w.a,...w.b].map(u=>{
          const on = (state.swaps?.[`${state.week}-${r}`]||[]).includes(u);
          return `<button class="tg${on?' on':''}" data-swap="${r}|${esc(u)}" aria-pressed="${on}">${esc(u)}</button>`;
        }).join('')}</div>
        <div class="note" style="margin-top:6px">Units moved across to even this round. ${D.config.points.balancePoints
          ? `Each earns ${D.config.points.balancePoints} balance point(s), ${esc(String(D.config.points.balancePointsStyle))}.`
          : 'Balance points are off, so this is recorded but scores nothing.'}</div></div></div>`;
  };

  const badge = (on,label) => `<span class="tag q" style="${on?'':'opacity:.45;border-style:dashed'}">${on?'':'no '}${label}</span>`;

  return `
  <div class="panel">
    <div class="ctl"><span class="cap">Night</span><select id="nb-pick">${sel}</select>
      <button class="gh">＋ New night</button><button class="gh">Duplicate</button>
      <i class="rule"></i>
      ${badge(R.points,'points')} ${badge(R.elo,'Elo')} ${badge(R.cooldown,'map cooldown')}
      <span class="tag q">${R.leads} lead${R.leads===1?'':'s'}</span></div>
    <div class="grid-f" style="padding:13px">
      ${field('Name', w.name, 'shown in the schedule and exports')}
      ${pick('Round type', RT, type, R.note, 'nb-type')}
      ${field('Date', '—', 'drives the schedule order')}
    </div>
  </div>
  ${panel('Rosters','move a unit between sides, or send the night to the balancer',
    `<div class="cols">${side('A')}${side('B')}</div>
     <div style="display:flex;align-items:center;gap:7px;padding:11px 13px;border-top:1px solid var(--line);flex-wrap:wrap">
       <button class="gh" data-go="balancer" data-id="x">Open balancer</button>
       <button class="gh">Clear both sides</button>
       <i class="rule"></i>
       <span class="meta">${bench.length?`bench: ${bench.length} unit${bench.length===1?'':'s'} unassigned`:'every registered unit is assigned'}</span></div>
     ${bench.length?`<div style="padding:0 13px 13px"><div class="rl">${bench.map(u=>`<span class="tag q" style="opacity:.6">${esc(u)}</span>`).join('')}</div></div>`:''}`, true)}
  ${panel('Results', R.points?'filling these updates the standings immediately':'recorded, but this night awards no points',
    `<div class="cols">${round(1)}${round(2)}</div>`, true)}`;
};

/* ── Balancer ───────────────────────────────────────────────────── */
V.balancer = () => {
  const B = D.config.balancer, w = D.weeks[state.week];
  const heads = Object.fromEntries(D.config.registry.map(u=>[u.name,(u.min+u.max)/2]));
  const pool = [...w.a,...w.b];
  const opts = [0,1,2].map(i=>{
    const shuffled = pool.slice().sort((a,b)=>((a.charCodeAt(0)*7+i*13)%11)-((b.charCodeAt(0)*7+i*13)%11));
    const A=[],Bs=[];
    shuffled.forEach((u,j)=>((j+i)%2?Bs:A).push(u));
    const sa = A.reduce((s,u)=>s+(heads[u]||0),0), sb = Bs.reduce((s,u)=>s+(heads[u]||0),0);
    return {A, B:Bs, sa, sb, diff:Math.abs(sa-sb), rep:[3,5,2][i], score:(97-i*6)};
  }).sort((a,b)=>b.score-a.score);

  const cards = opts.map((o,i)=>`<div class="col${i===0?' stripe-usa':''}">
    <div style="display:flex;align-items:center;gap:8px">
      <span class="cap">Option ${i+1}</span><i class="rule"></i>
      ${i===0?'<span class="tag usa">Best</span>':''}<span class="meta">score ${o.score}</span></div>
    <div class="hb" style="margin-top:9px"><span>Team A</span>
      <span class="t"><i style="width:${o.sa/Math.max(o.sa,o.sb)*100}%;background:var(--union)"></i></span>
      <span class="n">~${o.sa.toFixed(0)}</span></div>
    <div class="hb"><span>Team B</span>
      <span class="t"><i style="width:${o.sb/Math.max(o.sa,o.sb)*100}%;background:var(--reb)"></i></span>
      <span class="n">~${o.sb.toFixed(0)}</span></div>
    <div class="note" style="margin-top:8px">${o.diff.toFixed(0)}-man gap · ${o.A.length}v${o.B.length} units · ${o.rep} repeat pairings</div>
    <div class="rl" style="margin-top:8px">${o.A.map(u=>`<span class="tag q">${esc(u)}</span>`).join('')}</div>
    <div class="rl" style="margin-top:4px;opacity:.7">${o.B.map(u=>`<span class="tag q">${esc(u)}</span>`).join('')}</div>
    <div style="margin-top:9px"><button class="gh"${i===0?' aria-pressed="true"':''}>Apply to ${esc(w.name)}</button></div></div>`).join('');

  const rosterPaste = w.a.slice(0,4).map(u=>{
    const e = D.config.registry.find(x=>x.name===u);
    return `${u}\t${e?e.min:0}\t${e?e.max:0}`;
  }).join('\n');

  return `
  <div class="panel">
    <div class="ctl"><span class="cap">Balancing</span><span class="nm">${esc(w.name)}</span>
      <button class="gh" data-go="night" data-id="${state.week}">Back to the night</button>
      <i class="rule"></i><span class="meta">${pool.length} units · ~${pool.reduce((s,u)=>s+(heads[u]||0),0).toFixed(0)} men in the pool</span></div>
  </div>
  ${panel('Options', `showing ${B.balanceOptionCount}`, `<div class="cols">${cards}</div>`, true)}
  ${panel('Weights','what the score above is made of',
    `<div class="grid-f">
      ${field('Teammate history', B.teammateWeight, 'penalises units that keep landing together')}
      ${field('Average difference', B.avgDiffWeight, 'head-count gap between the sides')}
      ${field('Unit count', B.regimentCountWeight, 'keeps the number of units even')}
      ${field('Range similarity', B.rangeSimilarityWeight, 'matches min-max spread, not just the average')}
      ${field('Division opposition', B.divisionOppositionWeight, '0 = ignore divisions when splitting')}
      ${field('Post-season skill', B.postSeasonSkillWeight, 'spreads playoff pedigree; 0 off outside playoffs')}
      ${field('Options to show', B.balanceOptionCount, 'how many splits to generate')}
    </div>
    <div style="display:flex;gap:6px;margin-top:11px"><button class="gh">Reset to defaults</button></div>`)}
  ${panel('Company balancer','split a side into companies',
    `<div class="cols" style="margin:-13px">
      <div class="col"><div class="cap">Roster paste</div>
        <textarea rows="7" style="margin-top:7px">${esc(rosterPaste)}</textarea>
        <div class="note" style="margin-top:6px">One unit a line: name, min, max — tab separated. Paste straight from the sheet.</div></div>
      <div class="col"><div class="cap">Companies</div>
        <div class="grid-f" style="margin-top:7px">${field('Company count',2)}${field('Target size',35)}</div>
        ${[1,2].map(n=>`<div style="border:1px solid var(--line);margin-top:8px">
          <div class="bteam" style="background:var(--raised)"><span class="cap">Company ${n}</span>
            <span class="s">~${n===1?42:38} men</span></div>
          ${w.a.slice(n===1?0:2,n===1?2:4).map(u=>`<div class="bteam"><span class="nm">${esc(u)}</span>
            <span class="s">~${(heads[u]||0).toFixed(0)}</span></div>`).join('')}</div>`).join('')}
        <div style="display:flex;gap:6px;margin-top:9px"><button class="gh">Copy split</button><button class="gh">Open standalone splitter</button></div></div>
    </div>`, true)}`;
};

    <span class="meta">pin a steam id to a unit when the name tag is wrong</span></header>
